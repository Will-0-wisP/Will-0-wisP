name: Generate 3D Contribution Graphs

on:
  schedule:
    - cron: "0 0 * * *"        # Runs every day at 00:00 UTC
  workflow_dispatch:           # Allows manual run from GitHub Actions tab

jobs:
  generate-3d:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Generate 3D Contribution Graphs
        run: |
          npx github-profile-3d-contrib \
            --user ${{ github.repository_owner }} \
            --output-dir profile-3d-contrib \
            --theme night-rainbow

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          git commit -m "chore: update 3D contribution graphs [skip ci]" || exit 0
          git push
