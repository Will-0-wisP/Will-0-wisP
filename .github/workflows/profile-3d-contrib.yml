name: Generate 3D Contribution Graphs

on:
  schedule:
    - cron: "0 0 * * *"        # Runs daily at 00:00 UTC
  workflow_dispatch:           # Manual trigger

jobs:
  generate-3d:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # Required to commit the generated files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D Contribution Graphs
        uses: yoshi389111/github-profile-3d-contrib@master
        with:
          github_user_name: ${{ github.repository_owner }}
          theme: night-rainbow
          # Optional: generate multiple themes
          # themes: |
          #   night-rainbow
          #   dark
          #   summer

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          git commit -m "chore: update 3D contribution graphs [skip ci]" || exit 0
          git push
